<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Studio Flow</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0;
    font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 24px; text-align: center;
  }
  .mark {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 20px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    display: flex; align-items: center; justify-content: center;
  }
  .mark img { width: 40px; height: 40px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; color: #f8fafc; }
  p { margin: 0 0 20px; color: #94a3b8; max-width: 32ch; }
  button {
    font: inherit; font-weight: 500; color: #fff; background: #4f46e5;
    border: 0; border-radius: 10px; padding: 10px 20px; cursor: pointer;
  }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
  <div>
    <div class="mark"><img src="/icons/icon-192.png" alt="" /></div>
    <h1>You're offline</h1>
    <p>Studio Flow needs a connection to show your work. Nothing has been lost.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
